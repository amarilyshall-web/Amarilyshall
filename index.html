      align-items: center;
      padding: 60px 16px 80px;
    }

    /* ── PROFILE PHOTO ── */
    .profile-photo-wrap {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--rose), var(--plum));
      box-shadow: 0 8px 30px rgba(139, 42, 82, 0.25);
      animation: fadeDown 0.9s ease both;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .profile-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      background: #fff;
    }

    .profile-photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── NAME ── */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 6.5vw, 2.8rem);
      white-space: nowrap;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--plum);
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px 22px;
      border-radius: 40px;
      animation: fadeDown 0.9s 0.15s ease both;
    }

    .name-accent {
      display: block;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
      margin: 16px auto 32px;
      animation: fadeDown 0.9s 0.25s ease both;
    }

    /* ── LINKS ── */
    .links {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-decoration: none;
      color: var(--plum);
      box-shadow: 0 4px 18px rgba(139, 42, 82, 0.10);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.25s, background 0.3s;
      animation: fadeUp 0.8s ease both;
    }

    .link-card:nth-child(1) { animation-delay: 0.35s; }
    .link-card:nth-child(2) { animation-delay: 0.45s; }
    .link-card:nth-child(3) { animation-delay: 0.55s; }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(139, 42, 82, 0.5);
      box-shadow: 0 8px 26px rgba(139, 42, 82, 0.2);
      transform: translateY(-2px);
    }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--blush);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--plum);
    }

    .link-label { flex: 1; }

    .link-label span {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--plum);
      line-height: 1.15;
    }

    .link-label small {
      display: block;
      margin-top: 2px;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--plum-dark);
      opacity: 0.8;
    }

    .link-arrow {
      color: var(--plum);
      font-size: 1rem;
      opacity: 0.6;
      transition: opacity 0.3s, transform 0.3s;
    }

    .link-card:hover .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 56px;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--plum);
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      text-align: center;
      animation: fadeUp 0.8s 0.8s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
